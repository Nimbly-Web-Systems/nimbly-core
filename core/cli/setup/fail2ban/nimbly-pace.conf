# A page request: no file extension, and not an image, download, video,
# API call or admin screen. What a page loads by itself is not counted.
[Definition]
failregex = ^<HOST> \S+ \S+ [^"]*"(?:GET|HEAD) (?!/(?:img|api|nb-admin|download|video)/)(?![^" ?]*\.[A-Za-z0-9]{2,5}[? ])\S+ [^"]*" \d{3}\s
ignoreregex =
