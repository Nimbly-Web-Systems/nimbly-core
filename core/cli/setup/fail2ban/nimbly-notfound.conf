# A not-found answer for a page. A missing image, style, script, font or
# document is the site's own broken link, not a visitor guessing.
[Definition]
failregex = ^<HOST> \S+ \S+ [^"]*"[A-Z]+ (?![^" ?]*(?:\.(?:jpe?g|png|gif|webp|avif|svg|ico|css|js|map|woff2?|ttf|mp4|webm|pdf)[? ]|/\.well-known/))\S+ [^"]*" 404\s
ignoreregex =
