name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare ext
        run: mkdir -p ext && cp core/cli/setup/tailwind.theme.js ext/tailwind.theme.js && cp core/cli/setup/theme.css ext/theme.css

      - name: Build assets
        run: npm run build

      - name: Lint PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y -q php-cli php-mbstring php-xml php-zip php-gd php-curl php-gmp
          find core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Static analysis
        run: |
          curl -sSfL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.3.0/phpstan.phar
          echo "64a1e7737c6ac24b798a3331a769241308d40af6504630fd7c9dc9b7f1bec83f  /tmp/phpstan.phar" | sha256sum -c -
          php /tmp/phpstan.phar analyse -c .github/phpstan.neon --no-progress --memory-limit=1G

      - name: Run PHP tests
        shell: bash
        run: |
          set -o pipefail
          failed=""
          for test in core/tests/*-test.php; do
            echo "::group::$test"
            php -d memory_limit=128M "$test" 2>&1 | tee /tmp/test.log || failed="$failed $test"
            grep -qi 'skipped' /tmp/test.log && failed="$failed $test(skipped)"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
          echo "All PHP tests passed"

  e2e:
    # A low-risk commit skips the browser tests with [skip e2e] in its message.
    if: ${{ !contains(github.event.head_commit.message, '[skip e2e]') }}
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: nimbly
      NIMBLY_CONTAINER_NAME: nimbly-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Create .env
        run: |
          PEPPER=$(grep 'SetEnv PEPPER' .htaccess | awk '{print $3}')
          printf 'APP_ENV=dev\nBASE_PATH=/\nPEPPER=%s\nSITE_NAME=Nimbly\n' "$PEPPER" > .env

      - name: Prepare ext
        run: mkdir -p ext && cp core/cli/setup/tailwind.theme.js ext/tailwind.theme.js && cp core/cli/setup/theme.css ext/theme.css

      - name: Build assets
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev/Dockerfile
          load: true
          tags: nimbly-nimbly:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start dev container
        run: docker compose -f docker/dev/docker-compose.yml up -d
        env:
          COMPOSE_PROJECT_NAME: nimbly

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost/ -o /dev/null && { echo "Server ready after ${i}s"; break; }
            sleep 2
          done

      - name: System setup
        env:
          SITE_NAME: Nimbly
          ADMIN_EMAIL: admin@ci.test
          ADMIN_PASSWORD: Admin123!
        run: ./nimbly --docker system:setup

      - name: Run E2E tests
        timeout-minutes: 10
        run: ./nimbly --docker test:run

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: core/tests/playwright-report/
          retention-days: 14
